<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/xcelerate-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="XcelerateAI Learning OS — a focused workspace for moving through your course, missions, and builds." />
    <meta name="theme-color" content="#F5F7FC" />
    <title>XcelerateAI — Learning OS</title>
    <script>
      (() => {
        const validModes = new Set(['system', 'light', 'dark']);
        let mode = 'system';
        try {
          const stored = JSON.parse(localStorage.getItem('xca_settings') || '{}');
          if (validModes.has(stored.appearanceMode)) mode = stored.appearanceMode;
        } catch (_) {
          // A malformed preference should never prevent the application from loading.
        }
        const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const resolved = mode === 'system' ? (systemDark ? 'dark' : 'light') : mode;
        document.documentElement.dataset.theme = resolved;
        document.documentElement.dataset.themePreference = mode;
        document.querySelector('meta[name="theme-color"]')?.setAttribute('content', resolved === 'dark' ? '#0B1020' : '#F5F7FC');
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
